[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Redirect trailing slashes to non-trailing slashes
[[redirects]]
  from = "/:splat/"
  to = "/:splat"
  status = 301

# Cache images for faster loading
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"

# Cache CSS, JS, and fonts
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"

# Cache HTML files for shorter duration to allow updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "max-age=600"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
